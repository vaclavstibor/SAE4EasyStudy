services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-5001}:5000"
    environment:
      APP_SECRET_KEY: "${APP_SECRET_KEY:-8bf29bd88d0bfb94509f5fb0}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-study-framework}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: sqlite:////app/instance/db.sqlite
      DATASET_BOOTSTRAP: "${DATASET_BOOTSTRAP:-0}"
      DATASET_GITHUB_REPO: "${DATASET_GITHUB_REPO:-}" # Anonymized
      DATASET_RELEASE_TAG: "${DATASET_RELEASE_TAG:-latest}"
      ML_LATEST_DATASET_ASSET: "${ML_LATEST_DATASET_ASSET:-ml-latest.zip}"
      SAE_BOOTSTRAP_MODEL: "${SAE_BOOTSTRAP_MODEL:-0}"
      SAE_MODEL_GITHUB_REPO: "${SAE_MODEL_GITHUB_REPO:-}" # Anonymized
      SAE_MODEL_RELEASE_TAG: "${SAE_MODEL_RELEASE_TAG:-latest}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      GUNICORN_LOG_LEVEL: "${GUNICORN_LOG_LEVEL:-info}"
    volumes:
      - app-instance:/app/instance
      - app-cache:/app/server/cache

volumes:
  redis-data:
  app-instance:
  app-cache:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5001}:5000"
    environment:
      APP_SECRET_KEY: "${APP_SECRET_KEY:-8bf29bd88d0bfb94509f5fb0}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-study-framework}"
      DATABASE_URL: "sqlite:////data/instance/db.sqlite"
      DATA_ROOT: "/data"
      DATASET_BOOTSTRAP: "${DATASET_BOOTSTRAP:-0}"
      DATASET_GITHUB_REPO: "${DATASET_GITHUB_REPO:-}"
      DATASET_RELEASE_TAG: "${DATASET_RELEASE_TAG:-latest}"
      ML_LATEST_DATASET_ASSET: "${ML_LATEST_DATASET_ASSET:-ml-32m-filtered.zip}"
      SAE_BOOTSTRAP_MODEL: "${SAE_BOOTSTRAP_MODEL:-0}"
      SAE_MODEL_GITHUB_REPO: "${SAE_MODEL_GITHUB_REPO:-}"
      SAE_MODEL_RELEASE_TAG: "${SAE_MODEL_RELEASE_TAG:-latest}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      GUNICORN_LOG_LEVEL: "${GUNICORN_LOG_LEVEL:-info}"
    volumes:
      - app-data:/data

volumes:
  app-data:
